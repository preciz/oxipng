name: Build precompiled NIFs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15"]
        job:
          - { target: aarch64-unknown-linux-gnu   , os: ubuntu-22.04 , use-cross: true }
          - { target: aarch64-unknown-linux-musl  , os: ubuntu-22.04 , use-cross: true }
          - { target: arm-unknown-linux-gnueabihf , os: ubuntu-22.04 , use-cross: true }
          - { target: x86_64-unknown-linux-gnu    , os: ubuntu-22.04 }
          - { target: x86_64-unknown-linux-musl   , os: ubuntu-22.04 , use-cross: true }
          - { target: aarch64-apple-darwin        , os: macos-14 }
          - { target: x86_64-apple-darwin         , os: macos-14 }
          - { target: x86_64-pc-windows-gnu       , os: windows-2022 }
          - { target: x86_64-pc-windows-msvc      , os: windows-2022 }

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Extract project version
        shell: bash
        run: |
          echo "PROJECT_VERSION=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs | head -n1)" >> $GITHUB_ENV

      - name: Check if release asset already exists
        id: check_release
        shell: bash
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ] && gh release view "${{ github.ref_name }}" --json assets -q '.assets[].name' 2>/dev/null | grep -q "${{ matrix.job.target }}"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Asset for ${{ matrix.job.target }} already exists in release ${{ github.ref_name }}. Skipping build."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Rust toolchain
        if: steps.check_release.outputs.exists != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.job.target }}

      - name: Build the project
        if: steps.check_release.outputs.exists != 'true'
        id: build-crate
        uses: philss/rustler-precompiled-action@v1.1.5
        with:
          project-name: oxipng_nif
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use-cross }}
          project-dir: "native/oxipng_nif"

      - name: Artifact upload
        if: steps.check_release.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}

      - name: Publish archives and packages
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.build-crate.outputs.file-path }}
        if: startsWith(github.ref, 'refs/tags/') && steps.check_release.outputs.exists != 'true'
