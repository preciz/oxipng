name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    env:
      OXIPNG_BUILD: "true"
    strategy:
      matrix:
        elixir: ['1.18', '1.19', '1.20']
        otp: ['27.0', '28.0']
        exclude:
          - elixir: '1.18'
            otp: '28.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Check code formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test --cover

      - name: Check Elixir code
        run: mix credo --strict

      - name: Check native code
        if: matrix.elixir == '1.18' && matrix.otp == '27.0'
        working-directory: native/oxipng_nif
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Check pixel integrity with libpng
        if: matrix.elixir == '1.18' && matrix.otp == '27.0'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev
          cc -O2 test/support/decode_png.c $(pkg-config --cflags --libs libpng) -o /tmp/oxipng-decode
          OXIPNG_TEST_DECODER=/tmp/oxipng-decode mix test --only libpng
